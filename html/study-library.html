<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700&amp;family=Story+Script%3Awght%40400"
        onload="this.rel='stylesheet'" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Study Library - NeuroSync</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../js/sidemenu.js"></script>
    <script src="../js/theme.js"></script>

    <script type="module">
        import { initStudyLibrary } from '../js/study-library.js';

        // Initialize study library (bypassing authentication for local testing)
        initStudyLibrary();
    </script>
    <style type="text/tailwindcss">
        :root {
            --primary-color: #8013ec;
        }
        .translucent-button {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #FFFFFF;
            transition: all 0.3s ease;
        }
        .translucent-button:hover {
            background-color: rgba(147, 51, 234, 0.8);
            border: 1px solid rgba(147, 51, 234, 1);
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.7);
            color: #FFFFFF;
        }
        .text-primary { color: #FFFFFF; }
        .text-secondary { color: #ad92c9; }
        .accent-primary { color: var(--primary-color); }
        .border-primary { border-color: #2A1F36; }
        .bg-primary { background-color: #120B1A; }
        .bg-secondary { background-color: #1A1122; }
        .bg-tertiary { background-color: #2A1F36; }
    </style>
    <link rel="stylesheet" href="../css/mobile-optimizations.css" />
</head>

<body class="bg-primary dark">
    <div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden"
        style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'>
        <div class="absolute inset-0 -z-10 overflow-hidden">
            <!-- Background Particles -->
            <div class="particle" style="--x-start: 15vw; --y-start: 10vh; --x-end: 85vw; --y-end: 90vh;"></div>
            <div class="particle" style="--x-start: 75vw; --y-start: 20vh; --x-end: 25vw; --y-end: 80vh;"></div>
        </div>

        <header
            class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary px-4 sm:px-6 lg:px-10 py-3 bg-transparent backdrop-blur-sm sticky top-0 z-20">
            <div class="flex items-center gap-3 text-primary">
                <img src="../assets/Navbar_logo copy.png" alt="NeuroSync Logo" class="h-10 w-auto">
            </div>
            <div class="flex items-center gap-4">
                <button id="theme-toggle"
                    class="translucent-button flex items-center justify-center rounded-full size-11 hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined text-2xl">dark_mode</span>
                </button>
                <button class="xl:hidden translucent-button flex items-center justify-center rounded-full size-11"
                    id="mobile-menu-btn">
                    <span class="material-symbols-outlined text-2xl">menu</span>
                </button>
            </div>
        </header>

        <main class="flex-1 p-6 transition-all duration-300 ml-64" id="main-content">
            <div class="max-w-7xl mx-auto">
                <!-- Header Section -->
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold tracking-tight mb-2">Study Library</h1>
                    <p class="text-secondary">Access curated study materials and share your own resources</p>
                </div>

                <!-- Search and Filter Section -->
                <div class="bg-secondary/50 backdrop-blur-sm border border-primary rounded-xl p-6 mb-8">
                    <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                        <!-- Search Bar -->
                        <div class="flex-1 max-w-md">
                            <div class="relative">
                                <input type="text" id="search-input" placeholder="Search materials..."
                                    class="w-full px-4 py-3 bg-tertiary border border-primary rounded-lg text-primary placeholder-color focus:ring-accent focus:border-accent"
                                    onkeyup="searchMaterials()">
                                <span
                                    class="material-symbols-outlined absolute right-3 top-1/2 transform -translate-y-1/2 text-secondary">search</span>
                            </div>
                        </div>

                        <!-- Filter Buttons -->
                        <div class="flex flex-wrap gap-2">
                            <button id="filter-all" onclick="filterMaterials('all')"
                                class="filter-btn bg-accent text-primary px-4 py-2 rounded-full text-sm font-medium transition-colors">All</button>
                            <button id="filter-Mathematics" onclick="filterMaterials('Mathematics')"
                                class="filter-btn text-muted px-4 py-2 rounded-full text-sm font-medium transition-colors">Math</button>
                            <button id="filter-Science" onclick="filterMaterials('Science')"
                                class="filter-btn text-muted px-4 py-2 rounded-full text-sm font-medium transition-colors">Science</button>
                            <button id="filter-History" onclick="filterMaterials('History')"
                                class="filter-btn text-muted px-4 py-2 rounded-full text-sm font-medium transition-colors">History</button>
                            <button id="filter-English" onclick="filterMaterials('English')"
                                class="filter-btn text-muted px-4 py-2 rounded-full text-sm font-medium transition-colors">English</button>
                        </div>


                    </div>
                </div>

                <!-- Materials Grid -->
                <div id="materials-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Materials will be loaded here -->
                </div>
            </div>
    </div>



    <!-- Dropdown functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dropdownButtons = document.querySelectorAll('.relative.group button');
            dropdownButtons.forEach(button => {
                button.addEventListener('click', function (e) {
                    e.preventDefault();
                    const dropdown = this.parentElement.querySelector('.absolute');
                    if (dropdown) {
                        if (dropdown.classList.contains('hidden')) {
                            document.querySelectorAll('.absolute').forEach(d => {
                                d.classList.add('hidden');
                                d.classList.remove('block');
                            });
                            dropdown.classList.remove('hidden');
                            dropdown.classList.add('block');
                        } else {
                            dropdown.classList.add('hidden');
                            dropdown.classList.remove('block');
                        }
                    }
                });
            });

            document.addEventListener('click', function (e) {
                if (!e.target.closest('.relative.group')) {
                    document.querySelectorAll('.absolute').forEach(dropdown => {
                        dropdown.classList.add('hidden');
                        dropdown.classList.remove('block');
                    });
                }
            });
        });
    </script>
</body>

</html>
