<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Feedback - NeuroSync</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/mobile-optimizations.css" />
    <script src="../js/sidemenu.js"></script>
    <script src="../js/theme.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCFQ36vxZ5qWhxXXptKe_sXlFVZxzRtCBY",
            authDomain: "neurosync-5173b.firebaseapp.com",
            projectId: "neurosync-5173b",
            storageBucket: "neurosync-5173b.firebasestorage.app",
            messagingSenderId: "855780859936",
            appId: "1:855780859936:web:3044309100db9a61fa1c45",
            measurementId: "G-75S5GWYEDK"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check authentication and load profile
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'auth.html';
            } else {
                await loadUserProfile();
                loadFeedbackHistory();
            }
        });

        async function loadUserProfile() {
            const user = auth.currentUser;
            if (!user) return;

            try {
                const doc = await db.collection('Profiles').doc(user.uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    const displayName = `${data.firstname || ''} ${data.lastname || ''}`.trim() || user.email.split('@')[0] || 'User';

                    // Update all profile-related displays
                    const elements = {
                        'display-name': displayName,
                        'display-email': user.email,
                        'display-class': data.class || 'Not specified',
                        'display-role': data.role || 'Student'
                    };

                    for (const [id, value] of Object.entries(elements)) {
                        const el = document.getElementById(id);
                        if (el) el.textContent = value;
                    }
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        async function submitFeedback(event) {
            event.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const formData = new FormData(event.target);
            const rating = formData.get('rating');
            const category = formData.get('category');
            const message = formData.get('message');
            const anonymous = formData.get('anonymous') === 'on';

            if (!rating || !message.trim()) {
                showNotification('Please provide a rating and message', 'error');
                return;
            }

            try {
                const profileDoc = await db.collection('Profiles').doc(user.uid).get();
                const profileData = profileDoc.exists ? profileDoc.data() : {};

                await db.collection('Feedback').add({
                    userId: anonymous ? null : user.uid,
                    userName: anonymous ? 'Anonymous' : `${profileData.firstname || ''} ${profileData.lastname || ''}`.trim() || user.email.split('@')[0],
                    userRole: anonymous ? null : profileData.role,
                    rating: parseInt(rating),
                    category: category,
                    message: message.trim(),
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showNotification('Thank you for your feedback!', 'success');
                event.target.reset();
                loadFeedbackHistory();
            } catch (error) {
                console.error('Error submitting feedback:', error);
                showNotification('Error submitting feedback.', 'error');
            }
        }

        async function loadFeedbackHistory() {
            const user = auth.currentUser;
            if (!user) return;

            try {
                const snapshot = await db.collection('Feedback')
                    .where('userId', '==', user.uid)
                    .orderBy('submittedAt', 'desc')
                    .limit(5)
                    .get();

                const container = document.getElementById('feedback-history');
                if (!container) return;

                container.innerHTML = snapshot.empty ? '<p class="text-secondary text-center py-4">No recent history.</p>' : ''; snapshot.forEach(doc => {
                    const feedback = doc.data();
                    const card = document.createElement('div');
                    card.className = 'bg-white/5 p-4 rounded-xl border border-white/5 mb-3';
                    const stars = '★'.repeat(feedback.rating) + '☆'.repeat(5 - feedback.rating);
                    card.innerHTML = `
                        <div class="flex justify-between mb-1">
                            <span class="text-accent font-bold">${feedback.category}</span>
                            <span class="text-yellow-400 text-xs">${stars}</span>
                        </div>
                        <p class="text-sm text-gray-300 line-clamp-2">${feedback.message}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `fixed top-10 right-10 p-4 rounded-xl shadow-2xl z-[100] text-white animate-fade-in ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
    </script>
</head>

<body class="bg-primary dark">
    <div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden xl:ml-64"
        style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'>

        <!-- Header -->
        <header
            class="flex items-center justify-between border-b border-solid border-white/5 px-6 py-3 bg-transparent backdrop-blur-md sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <img src="../assets/Navbar_logo copy.png" alt="Logo" class="h-10 w-auto">
            </div>
            <div class="flex items-center gap-4">
                <button id="theme-toggle"
                    class="translucent-button rounded-full size-11 flex items-center justify-center">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
                <button id="mobile-menu-btn"
                    class="xl:hidden translucent-button rounded-full size-11 flex items-center justify-center">
                    <span class="material-symbols-outlined">menu</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6 lg:p-10">
            <div class="max-w-4xl mx-auto">
                <div class="text-center mb-10">
                    <h1 class="text-4xl font-bold text-white mb-2">Feedback & Support</h1>
                    <p class="text-[#ad92c9]">We value your thoughts on how to improve NeuroSync.</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Feedback Form Area -->
                    <div class="lg:col-span-2 space-y-6">
                        <section
                            class="bg-[#1a1122]/80 backdrop-blur-xl border border-white/5 rounded-3xl p-8 shadow-2xl">
                            <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                                <span class="material-symbols-outlined text-accent">edit_note</span>
                                Share Your Thoughts
                            </h2>
                            <form onsubmit="submitFeedback(event)" class="space-y-6">
                                <!-- Star Rating -->
                                <div class="space-y-3">
                                    <label class="text-sm font-medium text-gray-400">Overall Rating</label>
                                    <div class="flex gap-2" id="star-rating">
                                        <span
                                            class="star text-3xl cursor-pointer text-gray-600 hover:scale-110 transition-transform"
                                            data-rating="1">☆</span>
                                        <span
                                            class="star text-3xl cursor-pointer text-gray-600 hover:scale-110 transition-transform"
                                            data-rating="2">☆</span>
                                        <span
                                            class="star text-3xl cursor-pointer text-gray-600 hover:scale-110 transition-transform"
                                            data-rating="3">☆</span>
                                        <span
                                            class="star text-3xl cursor-pointer text-gray-600 hover:scale-110 transition-transform"
                                            data-rating="4">☆</span>
                                        <span
                                            class="star text-3xl cursor-pointer text-gray-600 hover:scale-110 transition-transform"
                                            data-rating="5">☆</span>
                                    </div>
                                    <input type="hidden" name="rating" id="rating-input" required>
                                </div>

                                <!-- Category & Message -->
                                <div class="grid grid-cols-1 gap-6">
                                    <div class="space-y-2">
                                        <label class="text-sm font-medium text-gray-400">Category</label>
                                        <select name="category" required
                                            class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-accent outline-none">
                                            <option value="">Select Category</option>
                                            <option value="Dashboard">Dashboard</option>
                                            <option value="Mood Tracker">Mood Tracker</option>
                                            <option value="Study Library">Study Library</option>
                                            <option value="Performance">Performance</option>
                                            <option value="Bug Report">Bug Report</option>
                                            <option value="Feature Request">Feature Request</option>
                                        </select>
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-sm font-medium text-gray-400">Your Feedback</label>
                                        <textarea name="message" rows="5" required placeholder="Tell us more..."
                                            class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-accent outline-none resize-none"></textarea>
                                    </div>
                                </div>

                                <div class="flex items-center gap-3 bg-white/5 p-4 rounded-xl border border-white/5">
                                    <input type="checkbox" name="anonymous" id="anonymous"
                                        class="rounded bg-black/40 border-white/10 text-accent focus:ring-accent">
                                    <label for="anonymous" class="text-sm text-gray-300 cursor-pointer">Submit
                                        anonymously</label>
                                </div>

                                <button type="submit"
                                    class="w-full bg-accent hover:bg-accent-secondary text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-accent/20">
                                    Submit Feedback
                                </button>
                            </form>
                        </section>
                    </div>

                    <!-- Sidebar Info / User Info / History -->
                    <div class="space-y-6">
                        <!-- User Info -->
                        <div class="bg-[#1a1122]/80 backdrop-blur-xl border border-white/5 rounded-3xl p-6">
                            <h3 class="text-lg font-bold text-white mb-4">Your Identity</h3>
                            <div class="space-y-4">
                                <div>
                                    <p class="text-xs text-gray-400 uppercase tracking-wider">Name</p>
                                    <p id="display-name" class="text-white font-medium">Loading...</p>
                                </div>
                                <div>
                                    <p class="text-xs text-gray-400 uppercase tracking-wider">Role</p>
                                    <p id="display-role" class="text-white font-medium">Loading...</p>
                                </div>
                            </div>
                        </div>

                        <!-- History -->
                        <div class="bg-[#1a1122]/80 backdrop-blur-xl border border-white/5 rounded-3xl p-6">
                            <h3 class="text-lg font-bold text-white mb-4">Recent Activity</h3>
                            <div id="feedback-history" class="space-y-3">
                                <!-- Loaded via JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- UI Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Star interaction
            const stars = document.querySelectorAll('.star');
            const ratingInput = document.getElementById('rating-input');

            stars.forEach((star, idx) => {
                star.addEventListener('click', () => {
                    const rating = idx + 1;
                    ratingInput.value = rating;
                    stars.forEach((s, i) => {
                        s.textContent = i < rating ? '★' : '☆';
                        s.classList.toggle('text-yellow-400', i < rating);
                        s.classList.toggle('text-gray-600', i >= rating);
                    });
                });
            });
        });
    </script>
</body>

</html>
