<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <title>Profile - NeuroSync</title>
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/mobile-optimizations.css" />
  <script src="../js/sidemenu.js"></script>
  <script src="../js/theme.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-storage-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCFQ36vxZ5qWhxXXptKe_sXlFVZxzRtCBY",
      authDomain: "neurosync-5173b.firebaseapp.com",
      projectId: "neurosync-5173b",
      storageBucket: "neurosync-5173b.firebasestorage.app",
      messagingSenderId: "855780859936",
      appId: "1:855780859936:web:3044309100db9a61fa1c45",
      measurementId: "G-75S5GWYEDK"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Check authentication
    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'auth.html';
      }
    });
  </script>
</head>

<body class="bg-primary dark">
  <div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden xl:ml-64"
    style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'>

    <!-- Header -->
    <header
      class="flex items-center justify-between border-b border-solid border-white/5 px-6 py-3 bg-transparent backdrop-blur-md sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <img src="../assets/Navbar_logo copy.png" alt="Logo" class="h-10 w-auto">
      </div>
      <div class="flex items-center gap-4">
        <button id="theme-toggle" class="translucent-button rounded-full size-11 flex items-center justify-center">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
        <button id="mobile-menu-btn"
          class="xl:hidden translucent-button rounded-full size-11 flex items-center justify-center">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 lg:p-10">
      <div class="max-w-4xl mx-auto">
        <div
          class="w-full rounded-3xl bg-[#1a1122]/80 backdrop-blur-xl shadow-2xl border border-white/5 overflow-hidden flex flex-col md:flex-row">

          <!-- Profile Photo Section -->
          <div
            class="relative w-full md:w-2/5 bg-gradient-to-br from-[#2a1b38] to-[#140c1c] flex flex-col items-center justify-center p-8 border-b md:border-b-0 md:border-r border-white/10">
            <div class="relative w-40 h-40 mb-6">
              <img src="" alt="Profile" id="profile-photo-preview"
                class="rounded-full object-cover w-full h-full ring-4 ring-accent/20 shadow-2xl" />
              <span id="photo-placeholder-text"
                class="absolute inset-0 flex items-center justify-center text-gray-500 text-sm hidden">No Photo</span>
              <button id="change-photo-button"
                class="absolute bottom-2 right-2 bg-accent text-white rounded-full p-2 shadow-lg hover:bg-accent-secondary transition-colors">
                <span class="material-symbols-outlined">photo_camera</span>
              </button>
            </div>
            <h2 class="text-2xl font-bold text-white mb-1" id="display-name">Loading...</h2>
            <p class="text-accent text-sm uppercase tracking-widest font-bold" id="display-role">Student</p>
          </div>

          <!-- Personal Info Section -->
          <div class="flex-1 p-8 sm:p-10">
            <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/10">
              <div>
                <h3 class="text-xl font-bold text-white">Personal Information</h3>
              </div>
              <div class="flex gap-3">
                <button id="edit-button"
                  class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all">
                  <span class="material-symbols-outlined text-sm">edit</span> Edit
                </button>
                <button id="save-button"
                  class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all hidden"
                  style="display: none;">
                  <span class="material-symbols-outlined text-sm">save</span> Save
                </button>
              </div>
            </div>

            <form id="profile-form" class="space-y-6">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="space-y-2">
                  <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">First Name</label>
                  <input type="text" id="firstName" readonly
                    class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-accent outline-none readonly:cursor-not-allowed">
                </div>
                <div class="space-y-2">
                  <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Last Name</label>
                  <input type="text" id="lastName" readonly
                    class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-accent outline-none readonly:cursor-not-allowed">
                </div>
                <div class="space-y-2">
                  <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Age</label>
                  <input type="number" id="age" readonly
                    class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-accent outline-none readonly:cursor-not-allowed">
                </div>
                <div class="space-y-2">
                  <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Class/Grade</label>
                  <input type="text" id="classGrade" readonly
                    class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-accent outline-none readonly:cursor-not-allowed">
                </div>
                <div class="space-y-2 sm:col-span-2">
                  <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Role</label>
                  <select id="role" disabled
                    class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 text-white focus:border-accent outline-none disabled:cursor-not-allowed">
                    <option value="Student">Student</option>
                    <option value="Teacher">Teacher</option>
                    <option value="Parent">Parent</option>
                  </select>
                </div>
                <input id="photoUrl" type="hidden" />
              </div>
              <div id="message" class="hidden p-4 rounded-xl text-center text-sm"></div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- UI Logic -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
  <script src="../js/profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const editBtn = document.getElementById('edit-button');
      const saveBtn = document.getElementById('save-button');
      const inputs = document.querySelectorAll('#profile-form input, #profile-form select');
      const changePhotoBtn = document.getElementById('change-photo-button');

      editBtn.addEventListener('click', () => {
        inputs.forEach(i => {
          if (i.id !== 'photoUrl') {
            i.removeAttribute('readonly');
            i.removeAttribute('disabled');
            i.classList.add('border-accent/40');
          }
        });
        editBtn.style.display = 'none';
        saveBtn.style.display = 'flex';
      });

      saveBtn.addEventListener('click', () => {
        if (typeof saveProfile === 'function') saveProfile();
        inputs.forEach(i => {
          i.setAttribute('readonly', true);
          if (i.tagName === 'SELECT') i.setAttribute('disabled', true);
          i.classList.remove('border-accent/40');
        });
        saveBtn.style.display = 'none';
        editBtn.style.display = 'flex';
      });

      changePhotoBtn.addEventListener('click', () => {
        if (typeof openUploadWidget === 'function') openUploadWidget();
      });
    });
  </script>
</body>

</html>
