<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>NeuroSync - Authentication</title>

  <!-- Favicon -->
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&family=Story+Script:wght@400&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/mobile-optimizations.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
  <script src="../js/theme.js"></script>

  <!-- Light mode overrides for auth card -->
  <style>
    body.light {
      background: linear-gradient(135deg, #FAF8FF 0%, #F0EAFF 40%, #EDE9FE 100%) !important;
    }

    body.light header {
      background-color: rgba(250, 248, 255, 0.9) !important;
      border-color: #DDD6FE !important;
    }

    body.light .translucent-button {
      background-color: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.25);
      color: #1E1030;
    }

    body.light .translucent-button:hover {
      background-color: rgba(124, 58, 237, 0.18);
      border-color: rgba(124, 58, 237, 0.5);
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.25);
      color: #1E1030;
    }

    /* Auth card in light mode */
    body.light #auth-card,
    body.light main>div {
      background-color: rgba(243, 238, 255, 0.95) !important;
      box-shadow: 0 20px 40px rgba(109, 40, 217, 0.15) !important;
    }

    body.light #form-title {
      color: #1E1030;
    }

    body.light #form-subtitle {
      color: #4B3D6B;
    }

    body.light label {
      color: #4B3D6B !important;
    }

    body.light input {
      background-color: #FFFFFF !important;
      border-color: #C4B5FD !important;
      color: #1E1030 !important;
    }

    body.light input::placeholder {
      color: #9B7FCA !important;
    }

    body.light .dropdown-menu {
      background-color: rgba(250, 248, 255, 0.97) !important;
      border-color: #DDD6FE !important;
    }

    body.light .dropdown-menu a {
      color: #1E1030 !important;
    }

    body.light .dropdown-menu a:hover {
      background-color: #EDE9FE !important;
    }

    body.light #auth-toggle {
      color: #4B3D6B;
    }

    body.light #auth-toggle a {
      color: #7C3AED;
    }

    body.light span.bg-\[\#1a1122\] {
      background-color: rgb(243, 238, 255) !important;
      color: #4B3D6B !important;
    }

    /* Social login buttons */
    body.light button.border-\[\#362348\] {
      background-color: #FFFFFF !important;
      border-color: #C4B5FD !important;
      color: #1E1030 !important;
    }

    body.light button.border-\[\#362348\]:hover {
      background-color: #EDE9FE !important;
    }

    body.light .particle {
      background-color: rgba(109, 40, 217, 0.2) !important;
    }
  </style>
</head>

<body class="bg-primary dark">
  <!-- Background Effects -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="particle"
      style="--x-start: 10vw; --y-start: 20vh; --x-end: 90vw; --y-end: 80vh; width: 2px; height: 2px; animation-delay: 0s;">
    </div>
    <div class="particle"
      style="--x-start: 80vw; --y-start: 10vh; --x-end: 20vw; --y-end: 90vh; width: 1px; height: 1px; animation-delay: -1s;">
    </div>
    <div class="particle"
      style="--x-start: 5vw; --y-start: 90vh; --x-end: 95vw; --y-end: 5vh; width: 3px; height: 3px; animation-delay: -2s;">
    </div>
    <div class="particle"
      style="--x-start: 95vw; --y-start: 85vh; --x-end: 5vw; --y-end: 15vh; width: 2px; height: 2px; animation-delay: -3s;">
    </div>
    <div class="particle"
      style="--x-start: 50vw; --y-start: 5vh; --x-end: 50vw; --y-end: 95vh; width: 1px; height: 1px; animation-delay: -4s;">
    </div>
  </div>

  <!-- Navigation -->
  <header
    class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary px-4 sm:px-6 lg:px-10 py-3 bg-transparent backdrop-blur-sm sticky top-0 z-20">
    <div class="flex items-center gap-3 text-primary">
      <a href="../index.html" class="flex items-center gap-3">
        <img src="../assets/Navbar_logo copy.png" alt="NeuroSync Logo" class="h-10 w-auto">
      </a>
    </div>
    <div class="flex items-center gap-4">
      <button id="theme-toggle"
        class="translucent-button flex items-center justify-center rounded-full size-11 hover:scale-110 transition-transform">
        <span class="material-symbols-outlined text-2xl">dark_mode</span>
      </button>
      <button onclick="window.location.href='../index.html'"
        class="translucent-button flex items-center justify-center rounded-full size-11">
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
      </button>
    </div>
  </header>

  <script type="module" src="../js/navbar.js"></script>

  <main class="flex flex-1 items-center justify-center py-12 md:py-0">
    <div class="mx-auto w-full max-w-md rounded-2xl bg-[#1a1122] p-8 shadow-2xl shadow-black/40">
      <div class="mb-2 text-center">
        <div
          class="inline-block rounded-full bg-gradient-to-br from-[var(--primary-500)] to-[var(--primary-700)] p-0.5">
          <div class="rounded-full bg-[#1a1122] p-2">
            <svg class="h-6 w-6 text-[var(--primary-400)]" fill="none" height="24" stroke="currentColor"
              stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
        </div>
      </div>
      <h2 id="form-title" class="mb-2 text-center text-3xl font-bold tracking-tighter">Create Your Free Account</h2>
      <p id="form-subtitle" class="mb-8 text-center text-sm text-gray-400">Unlock your potential with NeuroSync.
        It's free forever.</p>
      <form class="space-y-4" id="auth-form">
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-300" for="email">Email</label>
          <input
            class="form-input w-full rounded-lg border border-[#362348] bg-[#110d19] p-3 text-sm text-white placeholder:text-gray-500 transition-colors focus:border-[var(--primary-600)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-600)]/50"
            id="email" placeholder="you@example.com" type="email" />
        </div>
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-sm font-medium text-gray-300" for="password">Password</label>
            <a class="text-xs text-gray-400 underline-offset-2 transition-colors hover:text-white hover:underline"
              href="#">Forgot Password?</a>
          </div>
          <div class="relative">
            <input
              class="form-input w-full rounded-lg border border-[#362348] bg-[#110d19] p-3 pr-10 text-sm text-white placeholder:text-gray-500 transition-colors focus:border-[var(--primary-600)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-600)]/50"
              id="password" placeholder="••••••••" type="password" />
            <button id="toggle-password"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors"
              type="button">
              <span class="material-symbols-outlined text-lg">visibility</span>
            </button>
          </div>
        </div>

        <button id="submit-button"
          class="w-full rounded-lg bg-[var(--primary-600)] py-3 text-sm font-bold text-white shadow-lg shadow-[var(--primary-600)]/20 transition-all hover:bg-[var(--primary-700)] hover:shadow-xl hover:shadow-[var(--primary-700)]/30 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--primary-600)] focus:ring-offset-[#1a1122]"
          type="submit">
          Create Account
        </button>
        <div id="error-message" style="color: red; margin-top: 10px; text-align: center;"></div>
      </form>
      <div class="relative my-6 flex items-center justify-center">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-[#362348]"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="bg-[#1a1122] px-2 text-xs uppercase text-gray-400">Or continue with</span>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <button id="google-signin"
          class="flex w-full items-center justify-center rounded-lg border border-[#362348] bg-[#110d19] py-2.5 text-white transition-colors hover:bg-[#2c223a]/60">
          <svg aria-hidden="true" class="mr-2 h-5 w-5" data-icon="google" data-prefix="fab" focusable="false" role="img"
            viewBox="0 0 488 512" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 126 23.4 172.9 61.9l-76.2 76.2C324.7 122.3 289.2 106.8 248 106.8c-70.4 0-128.2 57.8-128.2 128.2s57.8 128.2 128.2 128.2c80.3 0 115.4-59.4 119.5-87.2H248v-95.6h239.3c-4.9 23.2-15.9 51.6-40.2 75.6z"
              fill="currentColor"></path>
          </svg>
          <span class="text-sm font-medium">Google</span>
        </button>
        <button
          class="flex w-full items-center justify-center rounded-lg border border-[#362348] bg-[#110d19] py-2.5 text-white transition-colors hover:bg-[#2c223a]/60">
          <svg aria-hidden="true" class="mr-2 h-5 w-5" data-icon="apple" data-prefix="fab" focusable="false" role="img"
            viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C39.2 141.6 0 184.2 0 241.2c0 61.6 40.2 153.2 88.5 204.3 26.2 28.5 55.5 58.3 90.5 58.3 35.2 0 49.4-18.5 82.5-18.5 33.7 0 47.4 18.5 82.5 18.5s54.5-29.8 80.5-58.3c15.2-16.6 25.3-34.8 29.8-51.4-40.4-23.4-62.4-62.4-62.4-101.4zM282.5 101.6c-16.6-18.5-35.2-31.5-56.5-31.5-20.2 0-36.9 14.5-50.5 31.5-12.7 15.5-22.8 34.2-22.8 54.5 0 20.8 9.3 39.5 22.8 53.5 13.5 14.2 30.2 25.2 50.5 25.2 21.2 0 40.2-11.2 56.5-25.2 14.2-15.5 22.8-34.2 22.8-53.5.1-20.3-9.5-39-22.8-54.5z"
              fill="currentColor"></path>
          </svg>
          <span class="text-sm font-medium">Apple</span>
        </button>
        <button
          class="flex w-full items-center justify-center rounded-lg border border-[#362348] bg-[#110d19] py-2.5 text-white transition-colors hover:bg-[#2c223a]/60">
          <svg aria-hidden="true" class="mr-2 h-5 w-5" data-icon="facebook" data-prefix="fab" focusable="false"
            role="img" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M504 256C504 119 393 8 256 8S8 119 8 256c0 123.78 90.69 226.38 209.25 245V327.69h-63V256h63v-54.64c0-62.15 37-96.48 93.67-96.48 27.14 0 55.52 4.84 55.52 4.84v61h-31.28c-30.8 0-40.41 19.12-40.41 38.73V256h68.78l-11 71.69h-57.78V501C413.31 482.38 504 379.78 504 256z"
              fill="currentColor"></path>
          </svg>
          <span class="text-sm font-medium">Facebook</span>
        </button>
      </div>
      <p id="auth-toggle" class="mt-6 text-center text-xs text-gray-400">
        Already have an account?
        <a class="text-gray-300 underline hover:text-white cursor-pointer">Sign In</a>
      </p>
    </div>
  </main>

  <script type="module" src="../js/auth.js"></script>
  <script>
    // Theme toggle for auth.html
    document.addEventListener('DOMContentLoaded', function () {
      const themeToggle = document.getElementById('theme-toggle');
      if (!themeToggle) return;
      const themeIcon = themeToggle.querySelector('span');

      function applyTheme(theme) {
        if (theme === 'light') {
          document.body.classList.remove('dark');
          document.body.classList.add('light');
          themeIcon.textContent = 'light_mode'; // sun = currently light
        } else {
          document.body.classList.remove('light');
          document.body.classList.add('dark');
          themeIcon.textContent = 'dark_mode'; // moon = currently dark
        }
        localStorage.setItem('theme', theme);
      }

      const saved = localStorage.getItem('theme') || 'dark';
      applyTheme(saved);

      themeToggle.addEventListener('click', function () {
        const isLight = document.body.classList.contains('light');
        applyTheme(isLight ? 'dark' : 'light');
      });
    });
  </script>
</body>

</html>
